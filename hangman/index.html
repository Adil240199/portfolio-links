<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f4f0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./assets/hang-man.png">
    <title>Hangman | Word Game</title>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <p class="game__eyebrow">Word game</p>
        <h1>Hangman</h1>
        <p class="game__attempts">Wrong guesses <span id="attempt-count">0</span> / 6</p>
      </header>

      <section class="game__play" aria-label="Hangman puzzle">
        <div class="game__illustration">
          <svg class="game__gallows" viewBox="0 0 353 581" fill="none" role="img" aria-label="Hangman gallows">
            <rect x="176.337" y="34.6662" width="39" height="199.598" transform="rotate(45 176.337 34.6662)" fill="black" stroke="#FFFEFE" stroke-width="3"/>
            <rect x="34.5" y="1.5" width="39" height="578" rx="3.5" fill="black" stroke="#FFFEFE" stroke-width="3"/>
            <rect x="351.5" y="34.5" width="39" height="350" rx="3.5" transform="rotate(90 351.5 34.5)" fill="black" stroke="#FFFEFE" stroke-width="3"/>
            <rect x="298" y="75" width="10" height="74" fill="black"/>
            <g id="figure" stroke="black" stroke-width="10" stroke-linecap="round">
              <circle data-part cx="303" cy="185" r="36" hidden/>
              <line data-part x1="303" y1="221" x2="303" y2="360" hidden/>
              <line data-part x1="303" y1="245" x2="245" y2="315" hidden/>
              <line data-part x1="303" y1="245" x2="361" y2="315" hidden/>
              <line data-part x1="303" y1="360" x2="255" y2="450" hidden/>
              <line data-part x1="303" y1="360" x2="351" y2="450" hidden/>
            </g>
          </svg>
          <p class="game__hint"><span>Hint</span><span id="hint"></span></p>
        </div>

        <div class="game__controls">
          <div class="game__word" id="word" role="group" aria-label="Hidden word"></div>
          <div class="game__keyboard" id="keyboard" aria-label="Choose a letter"></div>
          <p class="game__status" id="game-status" role="status" aria-live="polite"></p>
          <button class="game__next" id="next-word" type="button" disabled>Next word</button>
        </div>
      </section>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
