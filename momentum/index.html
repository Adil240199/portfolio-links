<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="assets/favicon.ico" rel="shortcut icon" />
    <link rel="stylesheet" href="css/owfont-regular.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>momentum</title>
  </head>
  <body>
    <header class="header">
      <div class="player">
        <audio
          class="audio"
          src="./assets/sounds/assets_sounds_AquaCaelestis.mp3"
        ></audio>
        <div class="player-controls">
          <button class="play-prev player-icon"></button>
          <button class="play player-icon"></button>
          <button class="play-next player-icon"></button>
        </div>
        <div class="progress-block">
          <div class="progress"></div>
        </div>
        <ul class="play-list">
          <li class="play-item">Aqua Caelestis</li>
          <li class="play-item">River Flows In You</li>
          <li class="play-item">Summer Wind</li>
          <li class="play-item">Ennio Morricone</li>
        </ul>
      </div>

      <div class="weather">
        <input
          type="text"
          class="Lng-city city"
          placeholder="[Enter city]"
          value="Budapest"
        />
        <i class="weather-icon owf"></i>
        <div class="weather-error"></div>
        <div class="description-container">
          <span class="temperature"></span>
          <span class="weather-description"></span>
        </div>
        <div class="wind"></div>
        <div class="humidity"></div>
      </div>
    </header>

    <main class="main">
      <div class="slider-icons">
        <button class="slide-prev slider-icon"></button>
        <button class="slide-next slider-icon"></button>
      </div>
      <time class="time"></time>
      <date class="date"></date>
      <div class="greeting-container">
        <span class="greeting"></span>
        <input type="text" class="name" placeholder="Enter name" />
      </div>
    </main>

    <footer class="footer">
      <button
        class="change-quote"
        type="button"
        aria-label="Change quote"
      ></button>
      <div>
        <div class="quote"></div>
        <div class="author"></div>
      </div>

      <aside class="setting" aria-label="Settings panel">
        <div class="setting-header">
          <span>Settings</span>
          <button
            class="close-setting"
            type="button"
            aria-label="Close settings"
          >
            ×
          </button>
        </div>

        <label class="setting-row">
          <span>Language</span>
          <select
            name="select"
            class="block_lang"
            aria-label="Language selector"
          >
            <option value="en">En</option>
            <option value="ru">Ru</option>
          </select>
        </label>

        <div class="setting-list">
          <label class="setting-item">
            <span>Audio</span>
            <input
              class="setting-toggle"
              type="checkbox"
              data-target="player"
              checked
            />
          </label>
          <label class="setting-item">
            <span>Weather</span>
            <input
              class="setting-toggle"
              type="checkbox"
              data-target="weather"
              checked
            />
          </label>
          <label class="setting-item">
            <span>Date</span>
            <input
              class="setting-toggle"
              type="checkbox"
              data-target="date"
              checked
            />
          </label>
          <label class="setting-item">
            <span>Greeting</span>
            <input
              class="setting-toggle"
              type="checkbox"
              data-target="greeting"
              checked
            />
          </label>
        </div>
      </aside>

      <button class="setting-icon" type="button" aria-label="Open settings">
        <img src="./assets/svg/sETTING.png" alt="setting-icon" />
      </button>

      <button class="todo-toggle" type="button" aria-label="Open todo list">
        <img src="./assets/svg/todolist.png" alt="todo" />
      </button>

      <aside class="todo_list" aria-label="ToDo list panel">
        <div class="todo-header">
          <h5>ToDo list</h5>
        </div>
        <div class="create_new_todo">
          <input
            type="text"
            class="message"
            placeholder="Add task"
            aria-label="Add task"
          />
          <button class="add" type="button">Add</button>
        </div>
        <div class="wrapper">
          <ul class="todo"></ul>
        </div>
      </aside>
    </footer>
    <script type="module" src="js/script.js"></script>
  </body>
</html>
